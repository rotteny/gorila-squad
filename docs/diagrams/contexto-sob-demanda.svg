<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Contexto sob demanda: −26%</title><desc id="d">Comparação animada do contexto base dos 12 agentes: antes 115.296 caracteres, depois 95.252, uma redução de 26 por cento, cerca de 5.700 tokens por invocação. Abaixo, as 8 skills ficam fora do contexto e só são carregadas quando a tarefa pede, por exemplo api-docs-ref quando o ESCANOR documenta uma API.</desc><style>.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.tc{text-anchor:middle}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes grow1{0%{transform:scaleX(0);opacity:1}10%{transform:scaleX(1)}90%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(1);opacity:0}}
@keyframes grow2{0%,8%{transform:scaleX(0);opacity:1}20%{transform:scaleX(1)}90%{transform:scaleX(1);opacity:1}96%,100%{transform:scaleX(1);opacity:0}}
@keyframes show{0%,20%{opacity:0;transform:scale(.8)}26%{opacity:1;transform:none}90%{opacity:1}96%,100%{opacity:0}}
@keyframes on{0%{opacity:0}2%{opacity:1}22%{opacity:1}25%,100%{opacity:0}}
@keyframes drop{0%{transform:translateY(0);opacity:1}12%{transform:translateY(52px);opacity:1}14%,100%{transform:translateY(52px);opacity:0}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
.breathe{animation:breathe 7s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:0 50%}
.b1{animation:grow1 12s cubic-bezier(.4,0,.2,1) infinite}.b2{animation:grow2 12s cubic-bezier(.4,0,.2,1) infinite}
.fade{animation:show 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
.on{opacity:0;animation:on 12s ease-in-out infinite}
.drop{opacity:0;animation:drop 12s ease-in infinite}
.s0{animation-delay:0s}.s1{animation-delay:3s}.s2{animation-delay:6s}.s3{animation-delay:9s}
.chip{fill:#0d1117;stroke:#6b7280;stroke-dasharray:5 4}
.wire{stroke:#ffb454;stroke-width:2}
@media (prefers-reduced-motion:reduce){.on.s0{opacity:1}}
